[package]
name = "unjess-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "unjessd"
path = "src/main.rs"

[dependencies]
unjess-core = { path = "../unjess-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
