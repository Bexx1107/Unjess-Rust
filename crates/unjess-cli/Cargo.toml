[package]
name = "unjess-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "unjess-cli"
path = "src/main.rs"

[dependencies]
unjess-core = { path = "../unjess-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
